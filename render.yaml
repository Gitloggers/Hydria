services:
  - type: web
    name: hydria-construction
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
    startCommand: |
      php -S 0.0.0.0:$PORT router.php
    envVars:
      - key: PHP_VERSION
        value: "8.1"
      - key: APP_ENV
        value: production
